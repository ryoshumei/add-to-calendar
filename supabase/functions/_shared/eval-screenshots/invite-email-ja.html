<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>【ご案内】新製品ローンチ 打ち合わせ</title>
<style>
  body {
    margin: 0;
    padding: 32px;
    background: #f1f3f4;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
      "Yu Gothic", Meiryo, sans-serif;
    color: #202124;
  }
  .mail {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 8px;
    overflow: hidden;
  }
  .subject { font-size: 26px; font-weight: 600; padding: 24px 32px 8px; }
  .from {
    padding: 0 32px 20px;
    font-size: 16px;
    color: #5f6368;
    border-bottom: 1px solid #e8eaed;
  }
  .from strong { color: #202124; }
  .card {
    margin: 24px 32px;
    border: 1px solid #dadce0;
    border-left: 6px solid #1a73e8;
    border-radius: 6px;
    padding: 20px 24px;
  }
  .card h2 { margin: 0 0 16px; font-size: 22px; }
  .row { display: flex; margin-bottom: 12px; font-size: 18px; line-height: 1.6; }
  .label { width: 88px; color: #5f6368; flex: none; }
  .value { font-weight: 500; }
  p.body { margin: 0 32px 28px; font-size: 17px; line-height: 1.9; color: #3c4043; }
  .sig { margin: 0 32px 28px; font-size: 15px; color: #5f6368; line-height: 1.7; }
</style>
</head>
<body>
  <div class="mail">
    <div class="subject">【ご案内】新製品ローンチ 打ち合わせ</div>
    <div class="from"><strong>佐藤 千夏</strong> &lt;sato@example.co.jp&gt; 宛先: 企画部各位</div>

    <div class="card">
      <h2>新製品ローンチ 打ち合わせ</h2>
      <div class="row"><span class="label">日時</span><span class="value">2026年7月14日（火）10:00 〜 11:00</span></div>
      <div class="row"><span class="label">場所</span><span class="value">本社 3F 第2会議室</span></div>
      <div class="row"><span class="label">主催</span><span class="value">佐藤 千夏（企画部）</span></div>
    </div>

    <p class="body">
      お疲れさまです。秋の新製品ローンチに向けて、告知スケジュールと価格の最終確認を行います。
      各担当は担当箇所の資料を前日までに共有フォルダへアップロードしてください。
    </p>

    <div class="sig">
      ------------------------------<br>
      株式会社ノースウィンド 企画部<br>
      佐藤 千夏
    </div>
  </div>
</body>
</html>
