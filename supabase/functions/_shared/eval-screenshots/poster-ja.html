<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>みなと夏祭り 2026</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
      "Yu Gothic", Meiryo, sans-serif;
    background: #7a1f1f;
    color: #fff;
  }
  .poster {
    width: 760px;
    margin: 0 auto;
    padding: 56px 48px 64px;
    background: linear-gradient(170deg, #8c2222 0%, #b3341f 55%, #e0632a 100%);
    text-align: center;
  }
  .kicker { font-size: 22px; letter-spacing: 10px; color: #ffe08a; margin-bottom: 20px; }
  h1 { font-size: 72px; margin: 0 0 12px; line-height: 1.15; }
  .year { font-size: 34px; color: #ffe08a; margin-bottom: 36px; }
  .rule { height: 3px; width: 160px; background: #ffe08a; margin: 0 auto 36px; }
  .when { font-size: 40px; font-weight: 700; margin-bottom: 12px; }
  .time { font-size: 34px; color: #ffe08a; margin-bottom: 34px; }
  .venue { font-size: 26px; line-height: 1.8; margin-bottom: 36px; }
  .program { font-size: 22px; line-height: 2; color: #ffeccd; margin-bottom: 36px; }
  .footer { font-size: 19px; color: #ffd9b0; line-height: 1.9; }
</style>
</head>
<body>
  <div class="poster">
    <div class="kicker">みなと商店会 主催</div>
    <h1>みなと夏祭り</h1>
    <div class="year">2026</div>
    <div class="rule"></div>

    <div class="when">2026年8月8日（土）</div>
    <div class="time">17:00 〜 21:00</div>

    <div class="venue">
      会場：みなと中央公園 芝生広場<br>
      港区みなと 3-12
    </div>

    <div class="program">
      盆踊り大会 ／ 屋台村 ／ 打ち上げ花火<br>
      地元太鼓「潮鼓」演奏
    </div>

    <div class="footer">
      入場無料・雨天決行（荒天中止）<br>
      お問い合わせ：みなと商店会事務局
    </div>
  </div>
</body>
</html>
