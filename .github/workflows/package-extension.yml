name: Package Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Create Extension Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create extension package
        env:
          # The same archive scripts/package-extension.sh builds for a manual
          # upload: one file list, so what a tag releases and what is uploaded
          # to the Web Store cannot drift apart.
          PACKAGE_ASSUME_YES: '1'
          PACKAGE_OUTPUT: add-to-calendar-extension-v${{ steps.get_version.outputs.VERSION }}.zip
        run: |
          chmod +x scripts/package-extension.sh
          scripts/package-extension.sh

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-v${{ steps.get_version.outputs.VERSION }}
          path: add-to-calendar-extension-v${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: add-to-calendar-extension-v${{ steps.get_version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify packaging success
        if: success()
        run: |
          echo "✅ Extension packaged successfully!"
          echo "Version: ${{ steps.get_version.outputs.VERSION }}"
          echo "Ready for Chrome Web Store submission"

      - name: Notify packaging failure
        if: failure()
        run: |
          echo "❌ Extension packaging failed!"
          exit 1
