name: Test Extension

on:
  push:
    branches:
      - main
      - master
      # Both spellings of the prefix: this repo has used feature/… and feat/…
      # (feat/screenshot-source), and 'feature/**' does not match 'feat/…'.
      - 'feature/**'
      - 'feat/**'
  pull_request:
    # Filtered on the branch a pull request targets, so a feat/… head branch
    # is already covered here.
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        # No xvfb: the extension fixture runs Chrome in --headless=new, which
        # wants no display. It was headed only because Playwright's own
        # headless mode cannot load an MV3 extension.
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Notify test success
        if: success()
        run: echo "✅ All tests passed!"

      - name: Notify test failure
        if: failure()
        run: |
          echo "❌ Tests failed!"
          echo "Check the test report artifact for details"
          exit 1

  backend:
    name: Run Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run backend unit tests
        # `npm run test:backend` is `deno test supabase/functions/_shared/`:
        # flagless on purpose, so the suite keeps needing no permissions.
        # npm ships with the runner image and the script only shells out to
        # deno, so there is nothing to install first.
        run: npm run test:backend
